name: Pipeline de CI/CD
run-name: Deploy in live
on: 
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lista archivos
        run: |
          ls -la

      - name: Imprimir mensaje de bienvenida
        run: |
             echo "¡Bienvenido a nuestro proyecto!"
             echo "Estamos construyendo y probando nuestro código."
             echo "¡Gracias por contribuir!"

  job2:
      needs: job1
      runs-on: ubuntu-latest
      steps:
      - name: Imprimir mensaje de bienvenida 2
        run: echo "¡Bienvenido a nuestro proyecto!"