name: Pipeline de CI/CD
run-name: Deploy in live
on: 
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    paths:
      - "*.md"

jobs:
  job1:
    environment: develop
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir mensaje de bienvenida job1
        run: |
             echo "¡Bienvenido, -${{ vars.NAME }}- a nuestro proyecto!"
             echo "Estamos construyendo y probando nuestro código."
             echo "¡Gracias por contribuir!"

      - name: Echo Secret
        run: echo "${{ secrets.SECRETO }}" > secreto.txt

  job2:
      environment: production
      needs: job1
      runs-on: ubuntu-latest
      steps:
      - name: Imprimir mensaje de bienvenida job2
        run: |
             echo "¡Bienvenido, -${{ vars.NAME }}- a nuestro proyecto!"
             echo "Estamos construyendo y probando nuestro código."
             echo "¡Gracias por contribuir!"

      - name: Echo Secret
        run: echo "${{ secrets.SECRETO }}" > secreto.txt

  job3:
      needs: job1
      runs-on: ubuntu-latest
      steps:
      - name: Imprimir mensaje de bienvenida job2
        run: |
             echo "¡Bienvenido, -${{ vars.NAME }}- a nuestro proyecto!"
             echo "Estamos construyendo y probando nuestro código."
             echo "¡Gracias por contribuir!"

      - name: Echo Secret
        run: echo "${{ secrets.SECRETO }}" > secreto.txt
